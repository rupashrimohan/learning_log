{% extends 'learning_log/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
<h1><a href="{%url 'learning_log:topic' topic.id}">{{topic}}</a></h1>
{% endblock page_header %}

{% block content %}

<p>Edit entry:
<p>

<form action="{% url 'learning_log:edit_entry' entry.id%}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save Changes" %}
</form>




{% endblock content %}

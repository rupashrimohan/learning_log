{% extends 'learning_log/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
<h1><a href="{% url 'learning_log:topic' topic.id %}">{{topic}}</a></h1>
{% endblock page_header %}

{% block content %}

<p>Add a new entry:</p>
<form action="{% url 'learning_log:new_entry' topic.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add Entry" %}
</form>

{% endblock content %}

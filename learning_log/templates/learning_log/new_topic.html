{% extends 'learning_log/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
<h1>Add a new topic</h1>
{% endblock page_header %}

{% block content %}
<form action="{% url 'learning_log:new_topic' %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add Topic" %}
</form>
{% endblock content %}
